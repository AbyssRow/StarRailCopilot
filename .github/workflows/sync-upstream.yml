name: Sync upstream into linux-avd

on:
  schedule:
    - cron: '23 19 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-linux-avd
  cancel-in-progress: false

jobs:
  merge-test-push:
    if: github.repository == 'AbyssRow/StarRailCopilot'
    runs-on: ubuntu-latest
    steps:
      - name: Check out linux-avd
        uses: actions/checkout@v6
        with:
          ref: linux-avd
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install lifecycle test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            adbutils==1.2.9 cached-property==1.5.2 inflection==0.5.1 \
            lxml==4.9.2 lz4==4.3.2 numpy==1.24.3 \
            opencv-python==4.7.0.72 pillow==9.5.0 psutil==5.9.3 \
            pydantic==2.4.2 pywebio==1.8.3 pyyaml==6.0 \
            rich==13.3.5 scipy==1.10.1 setuptools==68.2.2 \
            uiautomator2==2.16.17 uiautomator2cache==0.3.1 websockets==11.0.3

      - name: Merge upstream master
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/LmeSzinc/StarRailCopilot.git
          git fetch --no-tags upstream master
          git merge --no-edit upstream/master

      - name: Verify Linux AVD patch
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q module tests
          python -m module.config.config_updater
          git diff --exit-code

      - name: Push verified merge
        run: git push origin HEAD:linux-avd
