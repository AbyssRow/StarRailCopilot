name: Sync upstream into linux-avd

on:
  schedule:
    - cron: '37 */4 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Exercise the failure alert without changing the branch
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream-linux-avd
  cancel-in-progress: false

jobs:
  merge-test-push:
    if: github.repository == 'AbyssRow/StarRailCopilot'
    runs-on: ubuntu-latest
    steps:
      - name: Check out linux-avd
        uses: actions/checkout@v6
        with:
          ref: linux-avd
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Exercise failure alert
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "Intentional failure requested by workflow_dispatch"
          exit 1

      - name: Install lifecycle test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            adbutils==1.2.9 cached-property==1.5.2 inflection==0.5.1 \
            lxml==4.9.2 lz4==4.3.2 numpy==1.24.3 \
            opencv-python==4.7.0.72 pillow==9.5.0 psutil==5.9.3 \
            pydantic==2.4.2 pywebio==1.8.3 pyyaml==6.0 \
            rich==13.3.5 scipy==1.10.1 setuptools==68.2.2 \
            uiautomator2==2.16.17 uiautomator2cache==0.3.1 websockets==11.0.3

      - name: Merge upstream master
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/LmeSzinc/StarRailCopilot.git
          git fetch --no-tags upstream master
          git merge --no-edit upstream/master

      - name: Verify Linux AVD patch
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q module tests
          python -m module.config.config_updater
          git diff --exit-code

      - name: Push verified merge
        run: git push origin HEAD:linux-avd

  notify-failure:
    needs: merge-test-push
    if: ${{ always() && github.repository == 'AbyssRow/StarRailCopilot' && needs.merge-test-push.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update upstream sync alert
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_LABEL: linux-avd-sync
          ALERT_TITLE: '[linux-avd] Upstream sync failed'
        run: |
          gh api --method POST "repos/${REPOSITORY}/labels" \
            -f name="${ALERT_LABEL}" \
            -f color='B60205' \
            -f description='Automatic upstream sync needs attention' \
            >/dev/null 2>&1 || true

          issue_number="$(gh issue list \
            --repo "${REPOSITORY}" \
            --state open \
            --label "${ALERT_LABEL}" \
            --json number \
            --jq '.[0].number // empty')"
          message="Upstream sync failed. Inspect ${RUN_URL}. The remote linux-avd branch was not changed by the failed run."

          if [ -n "${issue_number}" ]; then
            gh issue comment "${issue_number}" --repo "${REPOSITORY}" --body "${message}"
          else
            gh issue create \
              --repo "${REPOSITORY}" \
              --title "${ALERT_TITLE}" \
              --body "${message}" \
              --label "${ALERT_LABEL}" \
              --assignee "${REPOSITORY_OWNER}"
          fi

  resolve-alert:
    needs: merge-test-push
    if: ${{ always() && github.repository == 'AbyssRow/StarRailCopilot' && needs.merge-test-push.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Close resolved upstream sync alert
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_LABEL: linux-avd-sync
        run: |
          gh api --method POST "repos/${REPOSITORY}/labels" \
            -f name="${ALERT_LABEL}" \
            -f color='B60205' \
            -f description='Automatic upstream sync needs attention' \
            >/dev/null 2>&1 || true

          issue_numbers="$(gh issue list \
            --repo "${REPOSITORY}" \
            --state open \
            --label "${ALERT_LABEL}" \
            --json number \
            --jq '.[].number')"

          if [ -z "${issue_numbers}" ]; then
            echo "No open upstream sync alert"
            exit 0
          fi

          for issue_number in ${issue_numbers}; do
            gh issue comment "${issue_number}" \
              --repo "${REPOSITORY}" \
              --body "Upstream sync recovered successfully: ${RUN_URL}"
            gh issue close "${issue_number}" --repo "${REPOSITORY}"
          done
